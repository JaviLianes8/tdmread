[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdmread"
version = "0.2.1"
description = "Zero-dependency, typed reader for NI TDM/TDX files (XML .tdm header plus binary .tdx), using only the Python standard library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["tdm", "tdx", "ni", "labview", "diadem", "measurement", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]
numpy = ["numpy"]

[project.scripts]
tdmread = "tdmread._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/tdmread"
Issues = "https://github.com/JaviLianes8/tdmread/issues"
Changelog = "https://github.com/JaviLianes8/tdmread/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/tdmread"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/tdmread",
    "tests",
    "scripts/fetch_upstream.py",
    "scripts/make_synthetic_tdm.py",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "pyproject.toml",
]
# Third-party samples are fetched locally for the tests and never shipped; only their manifest is.
exclude = ["**/__pycache__", "**/*.pyc", "tests/upstream/*.tdm", "tests/upstream/*.tdx"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
